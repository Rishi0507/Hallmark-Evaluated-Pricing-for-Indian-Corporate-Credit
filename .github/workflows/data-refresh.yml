name: data-refresh

on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      day:
        description: Business date (YYYY-MM-DD); defaults to today in IST
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.DATA_REFRESH_SCHEDULE == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ingest
      - name: Acquire and transform the latest business days
        env:
          DAY: ${{ inputs.day }}
        run: |
          if [ -n "$DAY" ]; then hallmark-ingest daily --day "$DAY"; else hallmark-ingest daily; fi
      - name: Data quality failures
        run: python -c "import polars as pl; print(pl.read_ndjson('data/silver/_dq/results.jsonl').filter(pl.col('failed') > 0))"
      - uses: actions/upload-artifact@v4
        with:
          name: silver-${{ github.run_id }}
          path: data/silver
          retention-days: 14
