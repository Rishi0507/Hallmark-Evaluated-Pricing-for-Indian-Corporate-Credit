name: hallmark

x-service: &service
  restart: unless-stopped
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
  environment: &service-env
    SPRING_PROFILES_ACTIVE: postgres
    KAFKA_BOOTSTRAP: kafka:9092
    DB_USER: hallmark
    DB_PASSWORD: hallmark

services:
  kafka:
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: -1
      KAFKA_NUM_PARTITIONS: 3
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:4.2.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in refdata.source.v1 market.curve.v1 trades.reported.v1 trades.settlement.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic hallmark.$$t --partitions 3
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic hallmark.control.eod.v1 --partitions 1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hallmark
      POSTGRES_USER: hallmark
      POSTGRES_PASSWORD: hallmark
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hallmark"]
      interval: 5s
      retries: 20

  refdata-service:
    <<: *service
    build: { context: ../../services, args: { SERVICE: refdata-service } }
    environment: { <<: *service-env, PORT: "8081", DB_URL: "jdbc:postgresql://postgres:5432/hallmark?currentSchema=refdata" }
    ports: ["8081:8081"]

  tradeflow-service:
    <<: *service
    build: { context: ../../services, args: { SERVICE: tradeflow-service } }
    environment: { <<: *service-env, PORT: "8082", DB_URL: "jdbc:postgresql://postgres:5432/hallmark?currentSchema=tradeflow" }
    ports: ["8082:8082"]

  pricing-service:
    <<: *service
    build: { context: ../../services, args: { SERVICE: pricing-service } }
    environment: { <<: *service-env, PORT: "8083", DB_URL: "jdbc:postgresql://postgres:5432/hallmark?currentSchema=pricing" }
    ports: ["8083:8083"]

  recon-service:
    <<: *service
    build: { context: ../../services, args: { SERVICE: recon-service } }
    environment: { <<: *service-env, PORT: "8084", DB_URL: "jdbc:postgresql://postgres:5432/hallmark?currentSchema=recon" }
    ports: ["8084:8084"]

  insights-api:
    build: { context: ../../insights-api }
    volumes: ["../../data:/data:ro"]
    ports: ["8090:8090"]

  web:
    build: { context: ../../web }
    depends_on: [refdata-service, tradeflow-service, pricing-service, recon-service, insights-api]
    ports: ["8080:8080"]

  ingest:
    profiles: ["jobs"]
    build: { context: ../.., dockerfile: ingest/Dockerfile }
    environment:
      HALLMARK_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes: ["../../data:/data"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  pgdata:
