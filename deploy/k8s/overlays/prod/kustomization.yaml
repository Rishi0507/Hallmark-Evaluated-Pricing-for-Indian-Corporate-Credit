apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: hallmark/refdata-service
    newName: ghcr.io/rishi0507/hallmark-refdata-service
    newTag: latest
  - name: hallmark/tradeflow-service
    newName: ghcr.io/rishi0507/hallmark-tradeflow-service
    newTag: latest
  - name: hallmark/pricing-service
    newName: ghcr.io/rishi0507/hallmark-pricing-service
    newTag: latest
  - name: hallmark/recon-service
    newName: ghcr.io/rishi0507/hallmark-recon-service
    newTag: latest
  - name: hallmark/insights-api
    newName: ghcr.io/rishi0507/hallmark-insights-api
    newTag: latest
  - name: hallmark/web
    newName: ghcr.io/rishi0507/hallmark-web
    newTag: latest
  - name: hallmark/ingest
    newName: ghcr.io/rishi0507/hallmark-ingest
    newTag: latest
patches:
  - target: {kind: Deployment, name: "(tradeflow|recon)-service"}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
