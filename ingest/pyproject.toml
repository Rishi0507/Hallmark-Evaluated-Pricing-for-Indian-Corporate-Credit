[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hallmark-ingest"
version = "0.1.0"
description = "Ingestion, normalisation and event publishing for public Indian debt-market data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.28",
  "polars>=1.40,<3",
  "pyarrow>=21",
  "duckdb>=1.5",
  "openpyxl>=3.1",
  "typer>=0.15",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "tenacity>=9",
  "structlog>=25",
  "jsonschema>=4.23",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.11"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.12", "mypy>=1.17"]

[project.scripts]
hallmark-ingest = "hallmark_ingest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hallmark_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: tests that call live public endpoints (deselected by default in CI)"]

[tool.coverage.run]
source = ["hallmark_ingest"]
omit = ["*/cli.py", "*/publish.py", "*/sink.py", "*/outputs.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
