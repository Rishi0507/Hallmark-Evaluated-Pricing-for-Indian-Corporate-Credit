server:
  port: ${PORT:8083}

spring:
  application:
    name: pricing-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/h2/pricing;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: pricing-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        linger.ms: 20
    listener:
      ack-mode: record

hallmark:
  kafka:
    concurrency: ${KAFKA_CONCURRENCY:1}
  pricing:
    universe-days: ${PRICING_UNIVERSE_DAYS:180}
    persist-marks-from: ${PRICING_PERSIST_MARKS_FROM:}
    curve-grace-seconds: ${PRICING_CURVE_GRACE_SECONDS:30}
    history-days: 75
    poll-ms: ${EOD_POLL_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.apache.kafka: WARN
