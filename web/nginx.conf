server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/refdata/ { proxy_pass http://refdata-service:8081/api/v1/; }
  location /api/tradeflow/ { proxy_pass http://tradeflow-service:8082/api/v1/; }
  location /api/pricing/ { proxy_pass http://pricing-service:8083/api/v1/; }
  location /api/recon/ { proxy_pass http://recon-service:8084/api/v1/; }
  location /api/insights/ { proxy_pass http://insights-api:8090/api/v1/; }

  location /data/ { add_header Cache-Control "public, max-age=300"; }
  location / { try_files $uri $uri/ /index.html; }
}
